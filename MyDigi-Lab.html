<!--
  LAB SCHEDULER — floor-plan based booking system for lab equipment
  =================================================================
  One self-contained file. No internet, no libraries, no build step.

  USAGE
  -----
  • Local:      double-click this file -> opens in your browser.
  • SharePoint: upload to a document library or place it on a Site page
                (see HOW TO SHARE THIS, at the bottom of this comment).

  STORAGE (important!)
  --------------------
  By default bookings are stored in the browser's localStorage. That means
  data stays on THIS computer/browser and is NOT shared between people or
  devices automatically.

  For truly shared use (everyone sees the same bookings) you need shared
  storage. Two options, both prepared below:

    1) SharePoint list (recommended if you have Microsoft 365).
       - Create a list "LabBookings" with the columns:
           EquipmentId   (Single line of text)
           EquipmentName (Single line of text)
           UserName      (Single line of text)
           Project       (Single line of text)
           BookDate      (Single line of text, format YYYY-MM-DD)
           StartTime     (Single line of text, format HH:MM)
           EndTime       (Single line of text, format HH:MM)
           Notes         (Multiple lines of text)
       - Set  STORAGE_MODE = 'sharepoint'  and  SP_LIST = 'LabBookings'  below.
       - Host this page WITHIN the same SharePoint site (same domain) so the
         sign-in/authentication is carried along.
       - PRIVACY / PERMISSIONS: to make the log visible to you only and stop
         others editing/deleting, set the list's item-level permissions
         (List settings -> Advanced settings): "Read items that were created
         by the user" + "Create and edit items that were created by the user".
         As list owner you still see and manage everything.

    2) Your own mini-server (if you don't use M365).
       Ask for the Python/Flask variant; a small server then runs on the lab
       network and everyone syncs through that address.

  ADMIN ACCESS (in-app)
  ---------------------
  The Log and Manage tabs, and the booking details, are hidden behind an admin
  PIN (config.adminPin, default '2468' — change it). NOTE: this is a UI gate to
  prevent casual viewing/tampering, not real security (anyone with the file can
  read it). Real privacy/permissions come from the SharePoint list above.

  HOW TO SHARE THIS IN SHAREPOINT
  -------------------------------
  Option A (fastest): upload the .html to a document library and share the link.
    (Use STORAGE_MODE = 'sharepoint' for shared data.)
  Option B (nice page): Site -> New -> Page -> "Embed" or "File viewer" web
    part. Some tenants block scripts in Embed; if so, use Option A.
-->
<!DOCTYPE html>
<html lang="nl" xmlns:mso="urn:schemas-microsoft-com:office:office" xmlns:msdt="uuid:C2F41010-65B3-11d1-A29F-00AA00C14882">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lab Scheduler</title>
<style>
  :root{
    --bg:#EAEEF2;
    --panel:#FFFFFF;
    --ink:#161E29;
    --ink-soft:#5C6776;
    --ink-faint:#919CAB;
    --line:#D7DEE6;
    --line-soft:#E9EDF1;
    --accent:#0C807F;
    --accent-deep:#0A615F;
    --accent-wash:#E3F1F0;
    --free:#2E9E5B;
    --free-wash:#E6F4EC;
    --busy:#BF4E2C;
    --busy-wash:#F8E9E2;
    --now:#C9810F;
    --now-wash:#FBF0DC;
    --font-ui:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
    --font-mono:"Cascadia Code","SF Mono",ui-monospace,"Consolas","Roboto Mono",monospace;
    --shadow:0 1px 2px rgba(22,30,41,.06),0 8px 24px rgba(22,30,41,.08);
    --radius:10px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:var(--bg);color:var(--ink);font-family:var(--font-ui);
    font-size:14px;line-height:1.45;
    -webkit-font-smoothing:antialiased;
    display:flex;flex-direction:column;height:100vh;overflow:hidden;
  }
  button{font-family:inherit;font-size:inherit;cursor:pointer}
  input,select,textarea{font-family:inherit;font-size:inherit;color:var(--ink)}

  /* ---------- header ---------- */
  header{
    flex:0 0 auto;background:var(--panel);border-bottom:1px solid var(--line);
    display:flex;align-items:center;gap:18px;padding:12px 20px;
  }
  .brand{display:flex;flex-direction:column;line-height:1.1}
  .brand .eyebrow{
    font-family:var(--font-mono);font-size:10px;letter-spacing:.18em;
    text-transform:uppercase;color:var(--accent);font-weight:600;
  }
  .brand .name{font-size:18px;font-weight:700;letter-spacing:-.01em;cursor:text}
  .brand .name:focus{outline:2px solid var(--accent-wash);border-radius:4px}
  .spacer{flex:1}
  .clock{
    font-family:var(--font-mono);font-size:13px;color:var(--ink-soft);
    background:var(--bg);border:1px solid var(--line);border-radius:8px;
    padding:6px 12px;letter-spacing:.04em;
  }
  .modeswitch{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:3px}
  .modeswitch button{
    border:0;background:transparent;color:var(--ink-soft);font-weight:600;
    padding:6px 14px;border-radius:6px;letter-spacing:.01em;
  }
  .modeswitch button.active{background:var(--panel);color:var(--ink);box-shadow:var(--shadow)}
  .iconbtn{
    border:1px solid var(--line);background:var(--panel);color:var(--ink-soft);
    border-radius:8px;padding:7px 12px;font-weight:600;
  }
  .iconbtn:hover{border-color:var(--accent);color:var(--accent)}
  .iconbtn.on{border-color:var(--accent);color:var(--accent);background:var(--accent-wash)}

  /* ---------- layout ---------- */
  main{flex:1;display:flex;min-height:0}
  .stage{flex:1;display:flex;flex-direction:column;min-width:0;padding:20px}
  .stage-head{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
  .stage-head h2{margin:0;font-size:13px;font-weight:700;letter-spacing:.02em}
  .hint{color:var(--ink-faint);font-size:12px}

  /* ---------- floorplan ---------- */
  .floor-wrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:4px}
  .floor{
    position:relative;border:1px solid var(--line);border-radius:var(--radius);
    overflow:hidden;box-shadow:var(--shadow);background:var(--panel);
  }
  .floorbase{position:absolute;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
  .floor-cap{
    position:absolute;left:14px;bottom:12px;z-index:3;font-family:var(--font-mono);
    font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint);pointer-events:none;
  }
  .legend{
    position:absolute;right:12px;bottom:12px;z-index:3;display:flex;gap:12px;
    background:rgba(255,255,255,.88);border:1px solid var(--line);border-radius:8px;
    padding:5px 10px;font-size:11px;color:var(--ink-soft);pointer-events:none;
  }
  .legend span{display:flex;align-items:center;gap:5px}
  .legend i{width:9px;height:9px;border-radius:50%}
  .device{
    position:absolute;transform:translate(-50%,-50%);z-index:1;
    background:#fff;border:1.5px solid var(--ink);border-radius:7px;
    box-shadow:0 2px 6px rgba(22,30,41,.14);
    display:flex;align-items:center;justify-content:center;text-align:center;
    padding:9px 7px 7px;user-select:none;overflow:hidden;
    transition:border-color .12s,box-shadow .12s;
  }
  .device::before{content:"";position:absolute;top:5px;left:6px;right:6px;height:3px;border-radius:2px;background:var(--accent)}
  .device.vert::before{top:6px;left:5px;right:5px}
  .device:hover{border-color:var(--accent);box-shadow:0 4px 14px rgba(12,128,127,.22);z-index:40}
  .device.dragging{box-shadow:0 12px 30px rgba(22,30,41,.28);z-index:50;cursor:grabbing}
  .mode-manage .device{cursor:grab}
  .mode-book  .device{cursor:pointer}
  .device .dname{
    font-weight:700;font-size:clamp(9px,1.0vw,13px);line-height:1.13;
    letter-spacing:-.01em;color:var(--ink);max-width:100%;
  }
  .device.vert .dname{writing-mode:vertical-rl;transform:rotate(180deg);white-space:nowrap}
  .device .dot{position:absolute;top:6px;right:6px;width:9px;height:9px;border-radius:50%;background:var(--ink-faint)}
  .device.vert .dot{top:auto;bottom:8px;right:auto;left:50%;transform:translateX(-50%)}
  .dot.free{background:var(--free)}
  .dot.now{background:var(--now);animation:pulse 1.8s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(201,129,15,.5)}70%{box-shadow:0 0 0 6px rgba(201,129,15,0)}100%{box-shadow:0 0 0 0 rgba(201,129,15,0)}}
  .device .delbtn{
    position:absolute;top:-9px;left:-9px;width:20px;height:20px;border-radius:50%;
    border:1px solid var(--line);background:#fff;color:var(--busy);
    font-size:13px;line-height:1;display:none;align-items:center;justify-content:center;padding:0;z-index:5;
  }
  .mode-manage .device .delbtn{display:flex}

  /* ---------- side panel (schedule) ---------- */
  aside{
    flex:0 0 380px;background:var(--panel);border-left:1px solid var(--line);
    display:flex;flex-direction:column;min-height:0;
    transform:translateX(100%);transition:transform .22s ease;
    position:relative;
  }
  aside.open{transform:translateX(0)}
  .panel-head{padding:16px 18px;border-bottom:1px solid var(--line)}
  .panel-head .ptype{font-family:var(--font-mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
  .panel-head .pname{font-size:17px;font-weight:700;margin:2px 0 0}
  .panel-head .closex{position:absolute;top:14px;right:14px;border:0;background:transparent;color:var(--ink-faint);font-size:20px;line-height:1;padding:4px}
  .datebar{display:flex;align-items:center;gap:8px;padding:12px 18px;border-bottom:1px solid var(--line-soft)}
  .datebar input[type=date]{border:1px solid var(--line);border-radius:7px;padding:6px 9px;background:var(--panel);font-family:var(--font-mono)}
  .stepbtn{border:1px solid var(--line);background:var(--panel);border-radius:7px;width:32px;height:32px;color:var(--ink-soft);font-size:15px}
  .stepbtn:hover{border-color:var(--accent);color:var(--accent)}
  .today-tag{font-family:var(--font-mono);font-size:11px;color:var(--free);font-weight:600;margin-left:auto}

  .slots{flex:1;overflow:auto;padding:10px 18px}
  .slot{
    display:grid;grid-template-columns:62px 1fr;gap:10px;align-items:stretch;
    border-left:2px solid var(--line);padding:2px 0 2px 12px;min-height:34px;position:relative;
  }
  .slot .t{font-family:var(--font-mono);font-size:11px;color:var(--ink-faint);padding-top:3px}
  .slot .body{border-radius:7px;padding:0}
  .slot.free .body{}
  .slot.free .body .freecell{
    height:30px;border:1px dashed var(--line);border-radius:7px;display:flex;align-items:center;
    padding:0 10px;color:var(--ink-faint);font-size:12px;cursor:pointer;
  }
  .mode-book .slot.free .body .freecell:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-wash)}
  .slot.booked{border-left-color:var(--busy)}
  .slot.booked .body .bk{
    background:var(--busy-wash);border:1px solid #EFCFC2;border-radius:7px;padding:6px 9px;
  }
  .slot.booked .body .bk .who{font-weight:700;font-size:12px}
  .slot.booked .body .bk .span{font-family:var(--font-mono);font-size:10px;color:var(--busy);letter-spacing:.03em}
  .slot.booked .body .bk .proj{font-family:var(--font-mono);font-size:10px;color:var(--ink-soft);margin-top:1px}
  .slot.booked .body .bk .note{font-size:11px;color:var(--ink-soft);margin-top:2px}
  .slot.booked .body .bk .cancel{border:0;background:transparent;color:var(--busy);font-size:11px;font-weight:600;padding:2px 0;margin-top:3px;text-decoration:underline}
  .slot.nowline::after{content:"";position:absolute;left:62px;right:0;top:0;height:2px;background:var(--now)}

  /* ---------- booking form ---------- */
  .booker{border-top:1px solid var(--line);padding:14px 18px;background:var(--bg)}
  .booker h3{margin:0 0 10px;font-size:12px;letter-spacing:.02em}
  .field{margin-bottom:9px}
  .field label{display:block;font-size:11px;color:var(--ink-soft);font-weight:600;margin-bottom:3px}
  .field input,.field select,.field textarea{
    width:100%;border:1px solid var(--line);border-radius:7px;padding:7px 9px;background:var(--panel);
  }
  .field textarea{resize:vertical;min-height:38px}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  .time-mono{font-family:var(--font-mono)}
  .primary{
    width:100%;border:0;background:var(--accent);color:#fff;font-weight:700;
    padding:10px;border-radius:8px;letter-spacing:.01em;margin-top:4px;
  }
  .primary:hover{background:var(--accent-deep)}
  .primary:disabled{background:var(--ink-faint);cursor:not-allowed}
  .formerr{color:var(--busy);font-size:11px;min-height:14px;margin-top:4px}

  /* ---------- manage add bar ---------- */
  .addbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
  .addbar input,.addbar select{border:1px solid var(--line);border-radius:7px;padding:7px 9px;background:var(--panel)}
  .addbar .primary{width:auto;margin:0;padding:8px 16px}
  .cfg{display:flex;gap:14px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--ink-soft);margin-bottom:10px}
  .cfg label{display:flex;align-items:center;gap:6px}
  .cfg input,.cfg select{border:1px solid var(--line);border-radius:6px;padding:5px 8px;font-family:var(--font-mono)}

  /* ---------- log view ---------- */
  .logwrap{flex:1;min-height:0;display:flex;flex-direction:column}
  .logfilters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
  .logfilters input,.logfilters select{border:1px solid var(--line);border-radius:7px;padding:7px 9px;background:var(--panel)}
  table{width:100%;border-collapse:collapse;font-size:13px}
  .tablecard{flex:1;min-height:0;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
  thead th{
    position:sticky;top:0;background:var(--panel);text-align:left;padding:10px 14px;
    font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);
    border-bottom:1px solid var(--line);font-weight:700;
  }
  tbody td{padding:9px 14px;border-bottom:1px solid var(--line-soft)}
  tbody tr:hover{background:var(--bg)}
  td.mono{font-family:var(--font-mono);font-size:12px;color:var(--ink-soft)}
  .empty{padding:40px;text-align:center;color:var(--ink-faint)}

  .toolbar-right{display:flex;gap:8px;margin-left:auto}

  /* ---------- toast ---------- */
  #toast{
    position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);
    background:var(--ink);color:#fff;padding:10px 18px;border-radius:9px;font-size:13px;
    box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:.2s;z-index:200;
  }
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  @media (max-width:820px){
    aside{position:fixed;inset:0 0 0 auto;width:100%;max-width:420px;z-index:100}
  }
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<body class="mode-book">

<header>
  <div class="brand">
    <span class="eyebrow">Lab Scheduler</span>
    <span class="name" id="labName" contenteditable="false" title="">My Lab</span>
  </div>
  <div class="spacer"></div>
  <div class="clock" id="clock">--:--</div>
  <div class="modeswitch" id="modeswitch">
    <button data-view="book" class="active">Book</button>
    <button data-view="log">Log</button>
    <button data-view="manage">Manage</button>
  </div>
  <button class="iconbtn" id="adminBtn" title="Admin access">Admin</button>
  <button class="iconbtn" id="exportBtn" title="Download backup">Export</button>
  <button class="iconbtn" id="importBtn" title="Load backup">Import</button>
  <input type="file" id="importFile" accept="application/json" hidden>
</header>

<main>
  <!-- BOOK + MANAGE share the floor -->
  <section class="stage" id="stageFloor">
    <div class="stage-head">
      <h2 id="stageTitle">Floor plan</h2>
      <span class="hint" id="stageHint">Click a machine to book it.</span>
    </div>

    <!-- manage controls (hidden in book mode) -->
    <div id="manageTools" style="display:none">
      <div class="cfg">
        <label>Open <input type="time" id="cfgOpen" class="time-mono"></label>
        <label>Close <input type="time" id="cfgClose" class="time-mono"></label>
        <label>Slot length
          <select id="cfgSlot">
            <option value="15">15 min</option>
            <option value="30">30 min</option>
            <option value="60">60 min</option>
          </select>
        </label>
        <span class="hint">Drag machines to reposition them.</span>
      </div>
      <div class="addbar">
        <input id="newName" placeholder="Machine name" style="min-width:160px">
        <input id="newType" placeholder="Type (e.g. Microscope)" style="min-width:150px">
        <button class="primary" id="addDevice">+ Add machine</button>
      </div>
    </div>

    <div class="floor-wrap" id="floorWrap">
      <div class="floor" id="floor">
        <svg class="floorbase" preserveAspectRatio="none" viewBox="0 0 1000 967" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI','Helvetica Neue',Arial,system-ui,sans-serif">

<script>
/* =======================================================================
   OPSLAG-CONFIGURATIE
   Zet STORAGE_MODE op 'sharepoint' en vul SP_LIST in om gedeeld te werken.
   ======================================================================= */
const STORAGE_MODE = 'local';        // 'local'  of  'sharepoint'
const SP_LIST      = 'LabBookings';  // naam van de SharePoint-lijst
const SP_WEB       = '';             // optioneel: volledige site-URL, bv. 'https://contoso.sharepoint.com/sites/lab'

/* ---------- kleine helpers ---------- */
const $  = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const pad = n => String(n).padStart(2,'0');
const todayISO = () => { const d=new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
const toMin = t => { const [h,m]=t.split(':').map(Number); return h*60+m; };
const fromMin = m => `${pad(Math.floor(m/60))}:${pad(m%60)}`;
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._x); t._x=setTimeout(()=>t.classList.remove('show'),2200); }

/* =======================================================================
   STATE
   ======================================================================= */
const DEFAULT_STATE = {
  config:{ labName:'My Lab', open:'08:00', close:'20:00', slot:30, adminPin:'2468' },
  equipment:[
    {id:uid(),name:'Split Hopkinson bar',type:'Impact',x:9.95,y:48.5,w:6.1,h:78.1,vertical:true},
    {id:uid(),name:'Universal testing machine (UTM)',type:'Tensile / compression',x:68.1,y:31.3,w:13.2,h:18.7},
    {id:uid(),name:'Impact tester',type:'Impact',x:81.4,y:71.4,w:14.8,h:10.3},
    {id:uid(),name:'Hardness tester',type:'Hardness',x:90,y:56.3,w:8.3,h:9.8},
    {id:uid(),name:'Microscope',type:'Microscopy',x:90,y:41.4,w:8.3,h:9.0},
    {id:uid(),name:'Cutting machine',type:'Machining',x:90,y:26.8,w:8.3,h:16.1},
    {id:uid(),name:'Ultrasonic tester',type:'Ultrasonic',x:41.45,y:58.7,w:6.9,h:10.2},
    {id:uid(),name:'3D printer 1',type:'Additive',x:55.6,y:91.9,w:13.8,h:6.0,requiresProject:false},
    {id:uid(),name:'3D printer 2',type:'Additive',x:70.2,y:91.9,w:13.7,h:6.0,requiresProject:false},
  ],
  bookings:[],
  audit:[]
};

let state = loadLocal();
function loadLocal(){
  try{ const raw=localStorage.getItem('labRoster'); if(raw){ const s=JSON.parse(raw); s.config=Object.assign({},DEFAULT_STATE.config,s.config); s.bookings=s.bookings||[]; s.audit=s.audit||[]; return s; } }
  catch(e){ console.warn('kon opslag niet lezen',e); }
  return structuredClone(DEFAULT_STATE);
}
function saveLocal(){ localStorage.setItem('labRoster', JSON.stringify(state)); }

/* =======================================================================
   OPSLAG-LAAG voor reserveringen (lokaal of SharePoint)
   Alle UI praat met BookingStore. Wissel van backend zonder UI te wijzigen.
   ======================================================================= */
const LocalBookingStore = {
  async list(){ return state.bookings.slice(); },
  async add(b){ b.id=uid(); state.bookings.push(b); saveLocal(); return b; },
  async remove(id){ state.bookings=state.bookings.filter(x=>x.id!==id); saveLocal(); }
};
const LocalAuditStore = {
  async list(){ return (state.audit||[]).slice(); },
  async add(ev){ ev.id=uid(); state.audit.push(ev); saveLocal(); return ev; }
};

/* SharePoint-implementatie. Werkt alleen als deze pagina BINNEN de SharePoint-
   site draait (zelfde domein) zodat de aanmelding meekomt. Zie kop-commentaar
   voor de benodigde lijstkolommen. */
const SP_BASE = (SP_WEB || (location.origin + location.pathname.split('/_layouts')[0])).replace(/\/$/,'');
async function spDigest(){
  const r = await fetch(`${SP_BASE}/_api/contextinfo`,{method:'POST',headers:{'Accept':'application/json;odata=nometadata'}});
  const j = await r.json(); return j.FormDigestValue || j.d.GetContextWebInformation.FormDigestValue;
}
const SharePointBookingStore = {
  async list(){
    const url=`${SP_BASE}/_api/web/lists/getbytitle('${SP_LIST}')/items?$top=2000&$select=Id,EquipmentId,EquipmentName,UserName,Project,BookDate,StartTime,EndTime,Notes`;
    const r=await fetch(url,{headers:{'Accept':'application/json;odata=nometadata'}});
    const j=await r.json();
    return (j.value||[]).map(it=>({id:String(it.Id),equipmentId:it.EquipmentId,equipmentName:it.EquipmentName,user:it.UserName,project:it.Project||'',date:it.BookDate,start:it.StartTime,end:it.EndTime,note:it.Notes||''}));
  },
  async add(b){
    const digest=await spDigest();
    const body={EquipmentId:b.equipmentId,EquipmentName:b.equipmentName,UserName:b.user,Project:b.project||'',BookDate:b.date,StartTime:b.start,EndTime:b.end,Notes:b.note||''};
    const r=await fetch(`${SP_BASE}/_api/web/lists/getbytitle('${SP_LIST}')/items`,{
      method:'POST',headers:{'Accept':'application/json;odata=nometadata','Content-Type':'application/json;odata=nometadata','X-RequestDigest':digest},
      body:JSON.stringify(body)});
    const j=await r.json(); b.id=String(j.Id); return b;
  },
  async remove(id){
    const digest=await spDigest();
    await fetch(`${SP_BASE}/_api/web/lists/getbytitle('${SP_LIST}')/items(${id})`,{
      method:'POST',headers:{'X-RequestDigest':digest,'IF-MATCH':'*','X-HTTP-Method':'DELETE'}});
  }
};
const Store = STORAGE_MODE==='sharepoint' ? SharePointBookingStore : LocalBookingStore;

/* Activity log: who created a booking, and who cancelled one. Admin-only view.
   In SharePoint mode this uses a second list "LabAudit" (see header comment). */
const SharePointAuditStore = {
  async list(){
    const url=`${SP_BASE}/_api/web/lists/getbytitle('LabAudit')/items?$top=4000&$orderby=Id desc&$select=Id,Action,BookUser,ByUser,Project,EquipmentName,BookDate,StartTime,EndTime,ActedAt`;
    const r=await fetch(url,{headers:{'Accept':'application/json;odata=nometadata'}});
    const j=await r.json();
    return (j.value||[]).map(it=>({id:String(it.Id),action:it.Action,user:it.BookUser,by:it.ByUser,project:it.Project||'',equipmentName:it.EquipmentName,date:it.BookDate,start:it.StartTime,end:it.EndTime,at:it.ActedAt}));
  },
  async add(ev){
    const digest=await spDigest();
    const body={Action:ev.action,BookUser:ev.user,ByUser:ev.by,Project:ev.project||'',EquipmentName:ev.equipmentName,BookDate:ev.date,StartTime:ev.start,EndTime:ev.end,ActedAt:ev.at};
    const r=await fetch(`${SP_BASE}/_api/web/lists/getbytitle('LabAudit')/items`,{
      method:'POST',headers:{'Accept':'application/json;odata=nometadata','Content-Type':'application/json;odata=nometadata','X-RequestDigest':digest},
      body:JSON.stringify(body)});
    const j=await r.json(); ev.id=String(j.Id); return ev;
  }
};
const Audit = STORAGE_MODE==='sharepoint' ? SharePointAuditStore : LocalAuditStore;

/* cache van reserveringen zodat de UI snel rendert; ververst na elke wijziging */
let bookingsCache=[];
async function refreshBookings(){ bookingsCache = await Store.list(); }

/* =======================================================================
   APP
   ======================================================================= */
let currentView='book';
let isAdmin=false;
let openDeviceId=null;
let panelDate=todayISO();

function slotsForDay(){
  const {open,close,slot}=state.config;
  const out=[]; for(let m=toMin(open);m+ +slot<=toMin(close);m+=+slot) out.push(m); return out;
}
function timeOptions(){ const {open,close,slot}=state.config; const out=[]; for(let m=toMin(open);m<=toMin(close);m+=+slot) out.push(fromMin(m)); return out; }

function bookingsFor(equipId,date){
  return bookingsCache.filter(b=>b.equipmentId===equipId && b.date===date)
                      .sort((a,b)=>toMin(a.start)-toMin(b.start));
}
function overlaps(aS,aE,bS,bE){ return toMin(aS)<toMin(bE) && toMin(bS)<toMin(aE); }

/* ---------- header / clock ---------- */
function tickClock(){
  const d=new Date();
  $('#clock').textContent = `${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d.getDay()]} ${pad(d.getDate())}-${pad(d.getMonth()+1)} · ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

/* ---------- floorplan render ---------- */
const FLOOR_RATIO = 1000/967;
function sizeFloor(){
  const wrap=$('#floorWrap'), floor=$('#floor');
  if(!wrap||!floor) return;
  const W=wrap.clientWidth-8, H=wrap.clientHeight-8;
  if(W<=0||H<=0) return;
  let w=W, h=w/FLOOR_RATIO;
  if(h>H){ h=H; w=h*FLOOR_RATIO; }
  floor.style.width=Math.floor(w)+'px'; floor.style.height=Math.floor(h)+'px';
}
function deviceStatus(eq){
  const now=new Date();
  const date=todayISO();
  const nowMin=now.getHours()*60+now.getMinutes();
  const today=bookingsFor(eq.id,date);
  const live=today.find(b=>toMin(b.start)<=nowMin && nowMin<toMin(b.end));
  if(live) return {cls:'now',label:`In use · ${live.user.split(' ')[0]}`,next:`until ${live.end}`};
  const upcoming=today.find(b=>toMin(b.start)>nowMin);
  return {cls:'free',label:'Free',next: upcoming?`next ${upcoming.start}`:'free rest of day'};
}
function renderFloor(){
  const floor=$('#floor');
  $$('.device').forEach(d=>d.remove());
  state.equipment.forEach(eq=>{
    const st=deviceStatus(eq);
    const el=document.createElement('div');
    el.className='device'+(eq.vertical?' vert':''); el.dataset.id=eq.id;
    el.style.left=eq.x+'%'; el.style.top=eq.y+'%';
    el.style.width=eq.w+'%'; el.style.height=eq.h+'%';
    el.title=`${eq.type||'Machine'} — ${st.label} (${st.next})`;
    el.innerHTML=`
      <button class="delbtn" title="Delete">&times;</button>
      <span class="dot ${st.cls}"></span>
      <span class="dname">${esc(eq.name)}</span>`;
    floor.appendChild(el);
    el.querySelector('.delbtn').addEventListener('click',ev=>{ ev.stopPropagation(); removeDevice(eq.id); });
    attachDeviceHandlers(el,eq);
  });
}
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* ---------- device interaction: click to book OR drag to move ---------- */
function attachDeviceHandlers(el,eq){
  let dragging=false,moved=false,startX,startY,origX,origY;
  el.addEventListener('pointerdown',e=>{
    if(e.target.classList.contains('delbtn'))return;
    if(currentView!=='manage'){ return; } // in book mode, click handled below
    dragging=true;moved=false;startX=e.clientX;startY=e.clientY;origX=eq.x;origY=eq.y;
    el.setPointerCapture(e.pointerId); el.classList.add('dragging');
  });
  el.addEventListener('pointermove',e=>{
    if(!dragging)return;
    const r=$('#floor').getBoundingClientRect();
    let nx=origX+((e.clientX-startX)/r.width)*100;
    let ny=origY+((e.clientY-startY)/r.height)*100;
    eq.x=Math.max(4,Math.min(96,nx)); eq.y=Math.max(5,Math.min(95,ny));
    el.style.left=eq.x+'%'; el.style.top=eq.y+'%';
    if(Math.abs(e.clientX-startX)>3||Math.abs(e.clientY-startY)>3)moved=true;
  });
  el.addEventListener('pointerup',e=>{
    if(dragging){ dragging=false; el.classList.remove('dragging'); if(moved){ saveLocal(); } }
  });
  el.addEventListener('click',()=>{ if(currentView==='book') openPanel(eq.id); });
}

/* ---------- side panel ---------- */
function openPanel(id){
  openDeviceId=id; panelDate=todayISO();
  $('#dDate').value=panelDate;
  const eq=state.equipment.find(e=>e.id===id);
  $('#pType').textContent=(eq.type||'Machine').toUpperCase();
  $('#pName').textContent=eq.name;
  const needProj = eq.requiresProject !== false;
  $('#projField').style.display = needProj ? 'block' : 'none';
  $('#bProject').value='';
  $('#panel').classList.add('open');
  fillTimeSelects();
  renderSlots();
}
function closePanel(){ $('#panel').classList.remove('open'); openDeviceId=null; }

function fillTimeSelects(){
  const opts=timeOptions();
  const s=$('#bStart'), e=$('#bEnd');
  s.innerHTML=opts.slice(0,-1).map(t=>`<option>${t}</option>`).join('');
  e.innerHTML=opts.slice(1).map(t=>`<option>${t}</option>`).join('');
  // sensible default: next round slot from now
  const nowMin=new Date().getHours()*60+new Date().getMinutes();
  const cand=opts.find(t=>toMin(t)>=nowMin) || opts[0];
  s.value = (panelDate===todayISO() && opts.includes(cand)) ? cand : opts[0];
  syncEnd();
}
function syncEnd(){
  const s=$('#bStart'), e=$('#bEnd');
  const opts=timeOptions();
  const after=opts.filter(t=>toMin(t)>toMin(s.value));
  e.innerHTML=after.map(t=>`<option>${t}</option>`).join('');
  e.value=after[0]||'';
}

function renderSlots(){
  const wrap=$('#slots'); wrap.innerHTML='';
  const eq=state.equipment.find(e=>e.id===openDeviceId); if(!eq)return;
  const day=bookingsFor(eq.id,panelDate);
  const nowMin=new Date().getHours()*60+new Date().getMinutes();
  const isToday=panelDate===todayISO();
  $('#todayTag').textContent = isToday?'today':'';

  slotsForDay().forEach(m=>{
    const t=fromMin(m);
    const bk=day.find(b=>toMin(b.start)<=m && m<toMin(b.end));
    const row=document.createElement('div');
    const isStartOfBk = bk && toMin(bk.start)===m;
    row.className='slot '+(bk?'booked':'free');
    if(isToday && nowMin>=m && nowMin< m+ +state.config.slot) row.classList.add('nowline');

    let bodyHtml='';
    if(bk){
      if(isStartOfBk){
        bodyHtml = `<div class="bk">
            <div class="who">${esc(bk.user)}</div>
            <div class="span">${bk.start}–${bk.end}</div>
            ${bk.project?`<div class="proj">Project ${esc(bk.project)}</div>`:''}
            ${bk.note?`<div class="note">${esc(bk.note)}</div>`:''}
            ${isAdmin?`<button class="cancel" data-cancel="${bk.id}">Cancel</button>`:''}
          </div>`;
      } else { bodyHtml = `<div style="height:30px"></div>`; }
    }else{
      bodyHtml = `<div class="body"><div class="freecell" data-free="${t}">Free — click to start here</div></div>`;
    }
    row.innerHTML=`<div class="t">${t}</div><div class="body">${bodyHtml}</div>`;
    wrap.appendChild(row);
  });

  wrap.querySelectorAll('[data-cancel]').forEach(b=>b.addEventListener('click',()=>cancelBooking(b.dataset.cancel)));
  wrap.querySelectorAll('[data-free]').forEach(c=>c.addEventListener('click',()=>{
    $('#bStart').value=c.dataset.free; syncEnd(); $('#bName').focus();
  }));
}

async function submitBooking(){
  const eq=state.equipment.find(e=>e.id===openDeviceId); if(!eq)return;
  const name=$('#bName').value.trim();
  const start=$('#bStart').value, end=$('#bEnd').value;
  const needProj = eq.requiresProject !== false;
  const project = needProj ? $('#bProject').value.trim() : '';
  const err=$('#bErr'); err.textContent='';
  if(!name){ err.textContent='Please enter your name.'; return; }
  if(needProj && !project){ err.textContent='Please enter a project number.'; return; }
  if(!start||!end||toMin(end)<=toMin(start)){ err.textContent='End time must be after start time.'; return; }
  const clash=bookingsFor(eq.id,panelDate).find(b=>overlaps(start,end,b.start,b.end));
  if(clash){ err.textContent=`Conflicts with ${clash.user} (${clash.start}–${clash.end}).`; return; }

  const btn=$('#bSubmit'); btn.disabled=true; btn.textContent='Saving…';
  try{
    await Store.add({equipmentId:eq.id,equipmentName:eq.name,user:name,project,date:panelDate,start,end,note:$('#bNote').value.trim()});
    await refreshBookings();
    $('#bNote').value='';
    renderSlots(); renderFloor(); refreshEquipFilter();
    toast(`Booked: ${eq.name} ${start}–${end}`);
  }catch(e){ err.textContent='Could not save: '+e.message; }
  finally{ btn.disabled=false; btn.textContent='Book this slot'; }
}

async function cancelBooking(id){
  if(!confirm('Cancel this booking?'))return;
  try{ await Store.remove(id); await refreshBookings(); renderSlots(); renderFloor(); renderLog(); toast('Booking cancelled'); }
  catch(e){ toast('Could not cancel'); }
}

/* ---------- manage ---------- */
function addDevice(){
  const name=$('#newName').value.trim(); if(!name){ $('#newName').focus(); return; }
  state.equipment.push({id:uid(),name,type:$('#newType').value.trim()||'Machine',x:50,y:48,w:11,h:9,vertical:false});
  $('#newName').value=''; $('#newType').value='';
  saveLocal(); renderFloor(); refreshEquipFilter(); toast('Machine added');
}
function removeDevice(id){
  const eq=state.equipment.find(e=>e.id===id);
  const n=bookingsCache.filter(b=>b.equipmentId===id).length;
  if(!confirm(`Delete "${eq.name}"?` + (n?` There are ${n} booking(s); they remain in the log.`:''))) return;
  state.equipment=state.equipment.filter(e=>e.id!==id); saveLocal(); renderFloor(); refreshEquipFilter();
}

/* ---------- log ---------- */
function refreshEquipFilter(){
  const sel=$('#fEquip'); const cur=sel.value;
  sel.innerHTML='<option value="">All machines</option>'+state.equipment.map(e=>`<option value="${e.id}">${esc(e.name)}</option>`).join('');
  sel.value=cur;
}
function filteredBookings(){
  const p=$('#fPerson').value.trim().toLowerCase();
  const eqid=$('#fEquip').value, from=$('#fFrom').value, to=$('#fTo').value;
  return bookingsCache.filter(b=>{
    if(p && !b.user.toLowerCase().includes(p))return false;
    if(eqid && b.equipmentId!==eqid)return false;
    if(from && b.date<from)return false;
    if(to && b.date>to)return false;
    return true;
  }).sort((a,b)=> (b.date+b.start).localeCompare(a.date+a.start));
}
function renderLog(){
  const rows=filteredBookings();
  const body=$('#logBody');
  if(!rows.length){ body.innerHTML=`<tr><td colspan="7"><div class="empty">No bookings found.</div></td></tr>`; return; }
  body.innerHTML=rows.map(b=>`
    <tr>
      <td class="mono">${b.date}</td>
      <td class="mono">${b.start}–${b.end}</td>
      <td>${esc(b.equipmentName||'')}</td>
      <td>${esc(b.user)}</td>
      <td class="mono">${esc(b.project||'')}</td>
      <td>${esc(b.note||'')}</td>
      <td><button class="cancel" style="border:0;background:transparent;color:var(--busy);font-weight:600;cursor:pointer" data-del="${b.id}">delete</button></td>
    </tr>`).join('');
  body.querySelectorAll('[data-del]').forEach(x=>x.addEventListener('click',()=>cancelBooking(x.dataset.del)));
}
function exportCSV(){
  const rows=filteredBookings();
  const head=['Date','Start','End','Machine','Person','Project','Note'];
  const csv=[head.join(';')].concat(rows.map(b=>
    [b.date,b.start,b.end,b.equipmentName,b.user,b.project||'',(b.note||'').replace(/[\r\n;]/g,' ')]
      .map(v=>`"${String(v).replace(/"/g,'""')}"`).join(';'))).join('\r\n');
  download('lab-log.csv','\uFEFF'+csv,'text/csv');
}

/* ---------- import / export ---------- */
function exportJSON(){ download('lab-scheduler-backup.json', JSON.stringify({state,bookings:bookingsCache},null,2),'application/json'); }
function download(fn,content,mime){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([content],{type:mime})); a.download=fn; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
function importJSON(file){
  const r=new FileReader();
  r.onload=async()=>{
    try{
      const data=JSON.parse(r.result);
      if(data.state){ state=data.state; state.config=Object.assign({},DEFAULT_STATE.config,state.config); saveLocal(); }
      if(STORAGE_MODE==='local' && Array.isArray(data.bookings)){ state.bookings=data.bookings; saveLocal(); }
      await refreshBookings(); applyConfigToUI(); renderFloor(); refreshEquipFilter(); renderLog();
      toast('Backup loaded');
    }catch(e){ toast('Invalid file'); }
  };
  r.readAsText(file);
}

/* ---------- view switching ---------- */
function setView(v){
  if((v==='log'||v==='manage') && !isAdmin){ v='book'; }
  currentView=v;
  $$('#modeswitch button').forEach(b=>b.classList.toggle('active',b.dataset.view===v));
  document.body.className = 'mode-'+(v==='manage'?'manage':'book');
  $('#stageFloor').style.display = (v==='log')?'none':'flex';
  $('#stageLog').style.display   = (v==='log')?'flex':'none';
  $('#manageTools').style.display= (v==='manage')?'block':'none';
  $('#labName').setAttribute('contenteditable', v==='manage'?'true':'false');
  if(v==='manage'){ $('#stageTitle').textContent='Floor plan — manage'; $('#stageHint').textContent='Drag, add or remove machines. Set opening hours.'; closePanel(); }
  else if(v==='book'){ $('#stageTitle').textContent='Floor plan'; $('#stageHint').textContent='Click a machine to book it.'; }
  if(v==='log'){ closePanel(); renderLog(); }
  renderFloor();
  requestAnimationFrame(sizeFloor);
}

/* ---------- admin gate ---------- */
function updateAdminUI(){
  $$('#modeswitch button').forEach(b=>{
    if(b.dataset.view==='log'||b.dataset.view==='manage') b.style.display = isAdmin?'':'none';
  });
  $('#exportBtn').style.display = isAdmin?'':'none';
  $('#importBtn').style.display = isAdmin?'':'none';
  const ab=$('#adminBtn'); ab.textContent = isAdmin?'Admin · on':'Admin'; ab.classList.toggle('on',isAdmin);
}

/* ---------- config UI ---------- */
function applyConfigToUI(){
  $('#labName').textContent=state.config.labName;
  $('#cfgOpen').value=state.config.open;
  $('#cfgClose').value=state.config.close;
  $('#cfgSlot').value=String(state.config.slot);
  $('#floorCap').textContent = state.config.labName + ' · floor plan';
}

/* =======================================================================
   EVENTS
   ======================================================================= */
$('#modeswitch').addEventListener('click',e=>{ const b=e.target.closest('button'); if(b)setView(b.dataset.view); });
$('#adminBtn').addEventListener('click',()=>{
  if(isAdmin){ isAdmin=false; if(currentView!=='book') setView('book'); updateAdminUI(); if(openDeviceId) renderSlots(); toast('Locked'); return; }
  const pin=prompt('Enter admin PIN');
  if(pin===null) return;
  if(pin===String(state.config.adminPin)){ isAdmin=true; updateAdminUI(); if(openDeviceId) renderSlots(); toast('Admin unlocked'); }
  else toast('Wrong PIN');
});
$('#panelClose').addEventListener('click',closePanel);
$('#dDate').addEventListener('change',e=>{ panelDate=e.target.value||todayISO(); fillTimeSelects(); renderSlots(); });
$('#dPrev').addEventListener('click',()=>stepDay(-1));
$('#dNext').addEventListener('click',()=>stepDay(1));
function stepDay(n){ const d=new Date(panelDate); d.setDate(d.getDate()+n); panelDate=`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; $('#dDate').value=panelDate; renderSlots(); }
$('#bStart').addEventListener('change',syncEnd);
$('#bSubmit').addEventListener('click',submitBooking);
$('#addDevice').addEventListener('click',addDevice);
$('#newName').addEventListener('keydown',e=>{ if(e.key==='Enter')addDevice(); });

$('#cfgOpen').addEventListener('change',e=>{ state.config.open=e.target.value; saveLocal(); if(openDeviceId){fillTimeSelects();renderSlots();} });
$('#cfgClose').addEventListener('change',e=>{ state.config.close=e.target.value; saveLocal(); if(openDeviceId){fillTimeSelects();renderSlots();} });
$('#cfgSlot').addEventListener('change',e=>{ state.config.slot=+e.target.value; saveLocal(); if(openDeviceId){fillTimeSelects();renderSlots();} });

$('#labName').addEventListener('blur',e=>{ const v=e.target.textContent.trim()||'My Lab'; state.config.labName=v; e.target.textContent=v; saveLocal(); $('#floorCap').textContent=v+' · floor plan'; });
$('#labName').addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); e.target.blur(); } });

['fPerson','fEquip','fFrom','fTo'].forEach(id=>$('#'+id).addEventListener('input',renderLog));
$('#fClear').addEventListener('click',()=>{ ['fPerson','fEquip','fFrom','fTo'].forEach(id=>$('#'+id).value=''); renderLog(); });
$('#csvBtn').addEventListener('click',exportCSV);
$('#exportBtn').addEventListener('click',exportJSON);
$('#importBtn').addEventListener('click',()=>$('#importFile').click());
$('#importFile').addEventListener('change',e=>{ if(e.target.files[0])importJSON(e.target.files[0]); e.target.value=''; });

/* =======================================================================
   START
   ======================================================================= */
async function init(){
  applyConfigToUI();
  await refreshBookings();
  refreshEquipFilter();
  updateAdminUI();
  sizeFloor();
  renderFloor();
  tickClock(); setInterval(()=>{ tickClock(); if(currentView==='book') renderFloor(); }, 30000);
  if(window.ResizeObserver){ new ResizeObserver(()=>sizeFloor()).observe($('#floorWrap')); }
  window.addEventListener('resize', sizeFloor);
}
init();
</script>
</body>
</html>
